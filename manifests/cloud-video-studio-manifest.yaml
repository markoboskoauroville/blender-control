apiVersion: antigravity.cloud/v1
kind: CloudVideoStudioManifest
metadata:
  name: blender-video-ai-studio
  version: "1.0.0"
  created_at: "2026-11-11T21:45:00+01:00"
  description: >-
    Declarative Google Cloud architecture manifest for the Prompt-Driven Video
    Editing & Headless Blender Compositing Platform (upload video + natural-language
    change prompt -> receive edited, debanded, temporally locked MP4), scoped to
    Marko's $300 GCP Free Credit with a $285.00 hard safety cap.

gcp:
  organization_id: "87869539786"
  organization_domain: auroville.email
  authenticated_account: marko.bosko@auroville.community
  billing_account_id: "0193A0-F5144A-C98D4D"
  recommended_project_id: blender-video-ai-studio
  shared_offload_project_id: antigravity-cloud-offload
  region: europe-west1
  media_bucket: gs://blender-video-ai-studio-media
  artifact_registry:
    repository: video-studio-repo
    location: europe-west1
    image_uri: europe-west1-docker.pkg.dev/blender-video-ai-studio/video-studio-repo/video-editor:latest
  required_apis:
    - run.googleapis.com
    - aiplatform.googleapis.com
    - cloudbuild.googleapis.com
    - artifactregistry.googleapis.com
    - storage.googleapis.com
    - billingbudgets.googleapis.com

budget_guardrails:
  currency: USD
  free_trial_credit_usd: 299.97
  credit_expiry: "2026-12-03"
  hard_cap_usd: 285.00
  safety_buffer_usd: 14.97
  alert_thresholds: [0.25, 0.50, 0.75, 0.90, 0.95]
  scale_to_zero_idle_floor: true

service_architecture:
  cloud_run_service:
    name: blender-video-studio
    region: europe-west1
    cpu: "4"
    memory: 8Gi
    min_instances: 0
    max_instances: 10
    concurrency: 2
    timeout_seconds: 900
    allow_unauthenticated: true
  runtime_stack:
    base_image: python:3.11-slim-bookworm
    system_packages:
      - blender
      - ffmpeg
      - libdav1d6
      - libgl1
      - libxrender1
      - libxi6
    python_packages:
      - fastapi
      - uvicorn[standard]
      - python-multipart
      - google-genai
      - google-cloud-storage
      - opencv-python-headless
      - scipy
      - numpy
  ai_planner:
    provider: vertex_ai
    primary_model: gemini-2.5-pro
    fast_model: gemini-2.5-flash
    location: europe-west1
    capabilities:
      - Decode any input codec (AV1/HEVC/H264) to 16-bit lossless frames + audio
      - Multimodal keyframe inspection via Vertex AI Gemini to parse natural-language edit prompts (any language, e.g. Croatian/English)
      - Generate structured edit plan (time-locked text/logo unmixing, chroma-rotated material recoloring, hardware/skin/floor preservation masks, specular contrast boost)
      - Execute parallel float32 + TPDF-dithered frame processing & headless Blender VSE/3D re-encode with original audio
      - Return side-by-side frame verification grid + downloadable high-bitrate H.264 MP4 from Cloud Storage
  endpoints:
    ui: GET /
    health: GET /health
    create_job: POST /api/edit-video
    job_status: GET /api/jobs/{job_id}
    download_video: GET /api/jobs/{job_id}/download
